<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>College Runs</title>
<meta name="description" content="College Runs - 3D Endless Campus Runner. Play instantly in your browser.">
<meta name="theme-color" content="#120c09">
<link rel="icon" href="game/index.icon.png">
<link rel="preload" as="fetch" href="game/index.pck" crossorigin>
<link rel="preload" as="fetch" href="game/index.wasm" crossorigin>
<link rel="preload" as="image" href="media/splash_minimal.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700;800&family=Rozha+One&family=Spline+Sans+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #120c09;
  --panel: rgba(28, 17, 13, 0.92);
  --panel-border: rgba(247, 236, 214, 0.16);
  --primary: #e4493b;
  --primary-glow: rgba(228, 73, 59, 0.45);
  --primary-hover: #ff5b4d;
  --cream: #f7ecd6;
  --mute: #a89d8b;
  --gold: #f5a623;
  --blue: #238bf5;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  color: var(--cream);
  font-family: 'Familjen Grotesk', system-ui, sans-serif;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}
/* Fullscreen Backdrop */
.bg-layer {
  position: fixed; inset: 0;
  background: radial-gradient(circle at 50% 40%, rgba(228, 73, 59, 0.18) 0%, rgba(18, 12, 9, 0.95) 70%, #0d0806 100%),
              url('media/fire_bg.jpg') center/cover no-repeat;
  filter: brightness(0.65) saturate(1.2);
  z-index: 0;
}
.bg-layer::after {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.8) 100%);
}

/* Minimal Centered Hub (Snake.io Style) */
#hub {
  position: relative; z-index: 10;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  width: 100%; height: 100%;
  padding: 20px;
  transition: opacity 0.35s ease, transform 0.35s ease;
}
#hub.hidden {
  opacity: 0; pointer-events: none; transform: scale(0.97);
}

.hub-card {
  width: min(440px, 94vw);
  background: var(--panel);
  border: 1px solid var(--panel-border);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 24px;
  padding: 32px 28px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65), 0 0 40px var(--primary-glow);
  display: flex; flex-direction: column; align-items: center; text-align: center;
}

/* Title Branding */
.game-title {
  font-family: 'Rozha One', Georgia, serif;
  font-size: clamp(38px, 8vw, 52px);
  line-height: 1;
  color: var(--cream);
  margin-bottom: 4px;
  text-shadow: 0 4px 18px rgba(0,0,0,0.6);
}
.game-title span { color: var(--primary); }
.subtitle {
  font-size: 13px; font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--mute);
  margin-bottom: 22px;
}

/* Stats Pill (Best Score Ever) */
.best-bar {
  display: inline-flex; align-items: center; gap: 10px;
  background: rgba(247, 236, 214, 0.08);
  border: 1px solid rgba(245, 166, 35, 0.35);
  padding: 8px 18px; border-radius: 999px;
  font-family: 'Spline Sans Mono', monospace;
  font-size: 13px; font-weight: 700;
  color: var(--cream);
  margin-bottom: 20px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
}
.best-bar svg { width: 16px; height: 16px; fill: var(--gold); }
.best-bar span.val { color: var(--gold); font-size: 16px; font-weight: 800; }

/* Direct Input Form */
.play-form {
  width: 100%;
  display: flex; flex-direction: column; gap: 14px;
}
.input-wrap { position: relative; width: 100%; }
.name-input {
  width: 100%; height: 56px;
  background: rgba(247, 236, 214, 0.07);
  border: 2px solid var(--panel-border);
  border-radius: 14px;
  padding: 0 18px;
  font: 700 18px 'Familjen Grotesk', sans-serif;
  color: var(--cream);
  text-align: center;
  outline: none;
  transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
}
.name-input:focus {
  border-color: var(--primary);
  background: rgba(247, 236, 214, 0.12);
  box-shadow: 0 0 0 4px var(--primary-glow);
}
.name-input::placeholder { color: var(--mute); font-weight: 500; }

/* Map Selector Pills */
.map-tabs {
  display: flex; width: 100%; gap: 8px;
}
.map-btn {
  flex: 1; padding: 10px 8px;
  background: rgba(247, 236, 214, 0.05);
  border: 1px solid var(--panel-border);
  border-radius: 12px;
  color: var(--mute);
  font: 700 13px 'Familjen Grotesk', sans-serif;
  cursor: pointer;
  transition: all 0.2s;
}
.map-btn.active {
  background: rgba(228, 73, 59, 0.2);
  border-color: var(--primary);
  color: var(--cream);
  box-shadow: 0 0 14px rgba(228, 73, 59, 0.25);
}

/* 1-Click Play Button */
.play-btn {
  width: 100%; height: 60px;
  background: linear-gradient(135deg, var(--primary) 0%, #b32a1e 100%);
  border: none; border-radius: 16px;
  color: var(--cream);
  font: 800 21px 'Familjen Grotesk', sans-serif;
  letter-spacing: 0.04em;
  display: flex; align-items: center; justify-content: center; gap: 12px;
  cursor: pointer;
  box-shadow: 0 8px 25px var(--primary-glow), inset 0 1px 0 rgba(255,255,255,0.3);
  transition: transform 0.12s, box-shadow 0.12s, background 0.2s;
}
.play-btn:hover {
  background: linear-gradient(135deg, var(--primary-hover) 0%, #c43224 100%);
  box-shadow: 0 12px 30px rgba(228, 73, 59, 0.6);
  transform: translateY(-2px);
}
.play-btn:active {
  transform: translateY(2px) scale(0.98);
}
.play-btn svg { width: 18px; height: 18px; fill: currentColor; }

/* Quick Leaderboard Drawer / Link */
.hub-footer {
  margin-top: 18px; display: flex; align-items: center; justify-content: space-between; width: 100%;
}
.footer-link {
  background: none; border: none;
  font: 600 13px 'Familjen Grotesk', sans-serif;
  color: var(--mute); cursor: pointer;
  text-decoration: none; display: flex; align-items: center; gap: 6px;
  transition: color 0.2s;
}
.footer-link:hover { color: var(--cream); }

/* Game Viewport Container */
#game-container {
  position: fixed; inset: 0; z-index: 20;
  background: #000;
  display: none;
}
#game-container.active { display: block; }
#game-frame {
  width: 100%; height: 100%; border: none; display: block;
}

/* Minimal Fullscreen Loading Screen (Your Custom Splash Image) */
#loading-overlay {
  position: absolute; inset: 0; z-index: 30;
  background: #000;
  display: none;
  flex-direction: column; align-items: center; justify-content: center;
}
#loading-overlay.active { display: flex; }
#loading-overlay img {
  max-width: 95vw; max-height: 85vh;
  object-fit: contain;
  box-shadow: 0 0 60px rgba(0,0,0,0.9);
}
.load-progress-bar {
  position: absolute; bottom: 36px;
  width: min(280px, 70vw); height: 5px;
  background: rgba(255,255,255,0.12);
  border-radius: 999px; overflow: hidden;
}
.load-progress-fill {
  width: 0%; height: 100%;
  background: linear-gradient(90deg, var(--blue), var(--primary));
  transition: width 0.25s ease-out;
}

/* Close/Back Button during Gameplay */
.in-game-exit {
  position: absolute; top: calc(14px + env(safe-area-inset-top)); right: 14px;
  z-index: 40;
  background: rgba(0,0,0,0.65);
  border: 1px solid rgba(255,255,255,0.2);
  color: #fff; font: 700 13px 'Familjen Grotesk', sans-serif;
  padding: 8px 16px; border-radius: 999px; cursor: pointer;
  backdrop-filter: blur(8px);
  display: none;
}
#game-container.active .in-game-exit { display: block; }

/* Leaderboard Modal */
#board-modal {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(12px);
  display: none; align-items: center; justify-content: center;
  padding: 20px;
}
#board-modal.active { display: flex; }
.board-box {
  width: min(420px, 92vw); max-height: 80vh;
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: 20px;
  padding: 24px; display: flex; flex-direction: column;
  position: relative;
}
.board-box h3 {
  font-family: 'Rozha One', serif; font-size: 26px; margin-bottom: 16px;
}
.board-list {
  list-style: none; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
}
.board-list li {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 14px; border-radius: 10px;
  background: rgba(255,255,255,0.04); font-size: 15px; font-weight: 600;
}
.board-list li .rk { color: var(--gold); font-family: monospace; width: 24px; }
.board-list li .sc { color: var(--gold); font-family: monospace; font-weight: 700; }
.board-close {
  margin-top: 16px; width: 100%; padding: 12px;
  background: rgba(255,255,255,0.08); border: 1px solid var(--panel-border);
  border-radius: 12px; color: var(--cream); font: 700 15px sans-serif; cursor: pointer;
}
</style>
</head>
<body>

<div class="bg-layer"></div>

<!-- Minimal 1-Click Game Hub (Snake.io Pattern) -->
<div id="hub">
  <div class="hub-card">
    <h1 class="game-title">College <span>Runs</span></h1>
    <div class="subtitle">Survive The Campus & Lake Road</div>

    <!-- Highest Achieved Score Banner -->
    <div class="best-bar">
      <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      <span>PERSONAL BEST:</span>
      <span class="val" id="topScore">0</span>
    </div>

    <!-- Instant 1-Click Form -->
    <form class="play-form" id="playForm" autocomplete="off">
      <div class="input-wrap">
        <input class="name-input" id="playerName" maxlength="16" placeholder="Enter Nickname" autocomplete="nickname">
      </div>

      <div class="map-tabs">
        <button type="button" class="map-btn active" data-map="campus">Campus Road</button>
        <button type="button" class="map-btn" data-map="fatehsagar">Fateh Sagar Lake</button>
      </div>

      <button type="submit" class="play-btn">
        <svg viewBox="0 0 14 14"><path d="M2 1l11 6-11 6z"/></svg>
        PLAY NOW
      </button>
    </form>

    <div class="hub-footer">
      <button class="footer-link" id="openBoardBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M7.5 21H2V9h5.5v12zm7 0H9V3h5.5v18zm7 0h-5.5V13H21v8z"/></svg>
        Leaderboard
      </button>
      <span style="font-size:12px;color:var(--mute)">Free Browser Game</span>
    </div>
  </div>
</div>

<!-- Game Viewport Frame -->
<div id="game-container">
  <button class="in-game-exit" id="exitBtn">✕ Main Menu</button>
  <div id="loading-overlay">
    <img src="media/splash_minimal.png" alt="College Runs Loading" draggable="false">
    <div class="load-progress-bar"><div class="load-progress-fill" id="loadFill"></div></div>
  </div>
  <iframe id="game-frame" title="College Runs Game" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe>
</div>

<!-- Leaderboard Modal -->
<div id="board-modal">
  <div class="board-box">
    <h3>Top High Scores</h3>
    <ul class="board-list" id="boardList">
      <li><span>No scores yet. Run and be first!</span></li>
    </ul>
    <button class="board-close" id="closeBoardBtn">Close</button>
  </div>
</div>

<script>
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

// Elements
const hub = document.getElementById('hub');
const playForm = document.getElementById('playForm');
const playerNameInput = document.getElementById('playerName');
const topScoreEl = document.getElementById('topScore');
const gameContainer = document.getElementById('game-container');
const gameFrame = document.getElementById('game-frame');
const loadingOverlay = document.getElementById('loading-overlay');
const loadFill = document.getElementById('loadFill');
const exitBtn = document.getElementById('exitBtn');
const mapButtons = document.querySelectorAll('.map-btn');

let selectedMap = store.get('iimrun_map', 'campus');

// 1. Calculate & Display User's Best Score Ever Achieved
function updateBestScore() {
  const bestCampus = store.get('iimrun_best_campus', 0);
  const bestLake = store.get('iimrun_best_fatehsagar', 0);
  const legacyBest = store.get('iimrun_best', 0);
  const overallBest = Math.max(bestCampus, bestLake, legacyBest);
  topScoreEl.textContent = overallBest.toLocaleString();
}
updateBestScore();

// 2. Preload Game Cache Immediately in background
(async function preloadAssets() {
  try {
    fetch('game/index.pck');
    fetch('game/index.wasm');
  } catch(e) {}
})();

// 3. Name Input (default to empty placeholder every refresh per request)
playerNameInput.value = '';
playerNameInput.placeholder = 'Enter Nickname';

// Map Switcher
mapButtons.forEach(btn => {
  if (btn.dataset.map === selectedMap) {
    mapButtons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
  btn.onclick = () => {
    mapButtons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedMap = btn.dataset.map;
    store.set('iimrun_map', selectedMap);
  };
});

// 4. 1-Click Instant Game Launcher
playForm.onsubmit = (e) => {
  e.preventDefault();
  let name = playerNameInput.value.trim();
  if (!name) name = 'Runner';
  store.set('iimrun_name', name);

  // Transition to game
  hub.classList.add('hidden');
  gameContainer.classList.add('active');
  loadingOverlay.classList.add('active');
  loadFill.style.width = '20%';

  const simProgress = setInterval(() => {
    const cur = parseFloat(loadFill.style.width) || 20;
    if (cur < 90) loadFill.style.width = (cur + 15) + '%';
  }, 100);

  // Load Godot game iframe
  gameFrame.src = `game/index.html?map=${selectedMap}&name=${encodeURIComponent(name)}`;
  gameFrame.onload = () => {
    clearInterval(simProgress);
    loadFill.style.width = '100%';
    setTimeout(() => {
      loadingOverlay.classList.remove('active');
      gameFrame.focus();
    }, 350);
  };
};

// 5. In-Game Exit (Back to Hub)
exitBtn.onclick = () => {
  gameFrame.src = 'about:blank';
  gameContainer.classList.remove('active');
  hub.classList.remove('hidden');
  updateBestScore();
};

// 6. Listen for Game-Over / Score Updates from Godot Engine
window.addEventListener('message', (e) => {
  const d = e.data;
  if (!d || !d.iimrun) return;
  if (d.iimrun === 'over') {
    const score = d.score || 0;
    const map = d.map || selectedMap;
    const name = d.name || store.get('iimrun_name', 'Runner');

    // Update Personal Best
    const bestKey = `iimrun_best_${map}`;
    const curBest = store.get(bestKey, 0);
    if (score > curBest) {
      store.set(bestKey, score);
    }
    updateBestScore();

    // Auto-Save into Leaderboard
    const key = `iimrun_board_${map}`;
    let list = store.get(key, []);
    const mapScores = new Map();
    for (const item of list) {
      if (item && item.name) {
        const prev = mapScores.get(item.name) || 0;
        if (item.score > prev) mapScores.set(item.name, item.score);
      }
    }
    const prevScore = mapScores.get(name) || 0;
    if (score > prevScore) mapScores.set(name, score);

    const next = [...mapScores.entries()]
      .map(([n, s]) => ({ name: n, score: s }))
      .sort((a, b) => b.score - a.score)
      .slice(0, 10);
    store.set(key, next);
  }
});

// Leaderboard Modal Logic
const boardModal = document.getElementById('board-modal');
const boardList = document.getElementById('boardList');
document.getElementById('openBoardBtn').onclick = () => {
  const key = `iimrun_board_${selectedMap}`;
  const list = store.get(key, []);
  boardList.innerHTML = '';
  if (!list.length) {
    boardList.innerHTML = '<li><span>No scores yet. Run and be first!</span></li>';
  } else {
    list.forEach((item, idx) => {
      const li = document.createElement('li');
      li.innerHTML = `<span><span class="rk">#${idx + 1}</span> ${item.name}</span><span class="sc">${item.score}</span>`;
      boardList.appendChild(li);
    });
  }
  boardModal.classList.add('active');
};
document.getElementById('closeBoardBtn').onclick = () => boardModal.classList.remove('active');
boardModal.onclick = (e) => { if (e.target === boardModal) boardModal.classList.remove('active'); };
</script>

</body>
</html>
